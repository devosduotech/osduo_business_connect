{%- extends "osduo_business_connect/templates/bc_base.html" -%}

{%- block page_content -%}
<style>
    .analytics-wrapper { display: flex; min-height: 100vh; }
    .analytics-sidebar { width: 240px; background: #1e293b; color: #e2e8f0; padding: 1.5rem 0; flex-shrink: 0; }
    .analytics-sidebar h2 { font-size: 1rem; font-weight: 700; padding: 0 1.5rem; margin: 0 0 1.5rem; color: #fff; }
    .analytics-sidebar a { display: block; padding: 0.6rem 1.5rem; color: #94a3b8; text-decoration: none; font-size: 0.85rem; transition: all 0.15s; }
    .analytics-sidebar a:hover, .analytics-sidebar a.active { background: rgba(255,255,255,0.08); color: #fff; }
    .analytics-sidebar .sidebar-section { margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid rgba(255,255,255,0.1); }
    .analytics-sidebar .sidebar-section-title { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.05em; color: #64748b; padding: 0 1.5rem; margin-bottom: 0.5rem; }
    .analytics-main { flex: 1; background: #f8fafc; padding: 2rem; overflow-y: auto; }
    .analytics-topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 2rem; }
    .analytics-topbar h1 { font-size: 1.5rem; font-weight: 700; color: #1e293b; margin: 0; }
    .analytics-topbar .filters { display: flex; gap: 0.75rem; align-items: center; }
    .analytics-topbar select { padding: 0.5rem 0.75rem; border: 1px solid #d1d5db; border-radius: 8px; font-size: 0.85rem; background: #fff; }
    .stat-card { background: #fff; border-radius: 10px; padding: 1.25rem; border: 1px solid #e2e8f0; transition: box-shadow 0.15s; }
    .stat-card:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .stat-card .stat-value { font-size: 2rem; font-weight: 700; }
    .stat-card .stat-label { font-size: 0.8rem; color: #64748b; margin-top: 0.25rem; }
    .chart-card { background: #fff; border-radius: 10px; padding: 1.5rem; border: 1px solid #e2e8f0; margin-bottom: 1.5rem; }
    .chart-card h5 { font-size: 0.95rem; font-weight: 600; color: #334155; margin: 0 0 1rem; }
    @media (max-width: 768px) {
        .analytics-sidebar { display: none; }
        .analytics-main { padding: 1rem; }
    }
</style>

<div class="analytics-wrapper">
    <div class="analytics-sidebar">
        <h2>OSDuo Business Connect</h2>
        <a href="/app/workspace">Dashboard</a>
        <a href="/analytics" class="active">Analytics</a>
        <div class="sidebar-section">
            <div class="sidebar-section-title">Content</div>
            <a href="/app/business">Businesses</a>
            <a href="/app/digital-card">Cards</a>
            <a href="/app/showcase-product">Products</a>
            <a href="/app/showcase-service">Services</a>
        </div>
        <div class="sidebar-section">
            <div class="sidebar-section-title">Engagement</div>
            <a href="/app/enquiry">Enquiries</a>
            <a href="/app/engagement-event">Events</a>
        </div>
    </div>

    <div class="analytics-main">
        <div class="analytics-topbar">
            <h1>Analytics Dashboard</h1>
            <div class="filters">
                <select id="analytics-business">
                    <option value="">Loading businesses...</option>
                </select>
                <select id="analytics-days">
                    <option value="7">Last 7 days</option>
                    <option value="15">Last 15 days</option>
                    <option value="30" selected>Last 30 days</option>
                    <option value="90">Last 90 days</option>
                    <option value="365">Last year</option>
                </select>
            </div>
        </div>

        <div id="analytics-loading" style="text-align:center;padding:4rem;color:#94a3b8;">
            <div style="font-size:2rem;margin-bottom:1rem;">&#128202;</div>
            Loading analytics...
        </div>
        <div id="analytics-content" style="display:none;"></div>
    </div>
</div>

<script>
var CSRF_TOKEN = document.querySelector('meta[name="csrf-token"]').getAttribute("content");

function escapeHtml(str) {
    if (!str) return '';
    var div = document.createElement('div');
    div.appendChild(document.createTextNode(str));
    return div.innerHTML;
}

function apiCall(method, args) {
    return fetch("/api/method/" + method, {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "X-Frappe-CSRF-Token": CSRF_TOKEN
        },
        credentials: "same-origin",
        body: JSON.stringify(args || {})
    }).then(function(r) { return r.json(); });
}

document.addEventListener("DOMContentLoaded", function() {
    var bSelect = document.getElementById("analytics-business");
    var dSelect = document.getElementById("analytics-days");

    bSelect.addEventListener("change", loadAnalytics);
    dSelect.addEventListener("change", loadAnalytics);

    apiCall("osduo_business_connect.pages.analytics.get_business_list")
        .then(function(r) {
            if (r.message && r.message.length) {
                bSelect.innerHTML = r.message.map(function(b) {
                    return '<option value="' + escapeHtml(b.name) + '">' + escapeHtml(b.business_name) + '</option>';
                }).join("");
                loadAnalytics();
            } else {
                bSelect.innerHTML = '<option value="">No businesses found</option>';
                document.getElementById("analytics-loading").innerHTML =
                    '<div style="font-size:2rem;margin-bottom:1rem;">&#128269;</div>No businesses found for your account.';
            }
        })
        .catch(function(err) {
                document.getElementById("analytics-loading").innerHTML =
                    '<div style="color:#dc3545;">Error loading: ' + escapeHtml(err.message) + '</div>';
        });

    function loadAnalytics() {
        var business = bSelect.value;
        var days = dSelect.value;
        if (!business) return;

        document.getElementById("analytics-loading").style.display = "block";
        document.getElementById("analytics-content").style.display = "none";

        apiCall("osduo_business_connect.pages.analytics.get_analytics", { business: business, days: days })
            .then(function(r) {
                document.getElementById("analytics-loading").style.display = "none";
                document.getElementById("analytics-content").style.display = "block";
                if (r.message) renderAnalytics(r.message);
            })
            .catch(function(err) {
                document.getElementById("analytics-loading").innerHTML =
                    '<div style="color:#dc3545;">Error: ' + escapeHtml(err.message) + '</div>';
            });
    }

    function renderAnalytics(data) {
        var eng = data.engagement;
        var enq = data.enquiry_stats;
        var summary = data.summary;
        var container = document.getElementById("analytics-content");

        var html = '<div class="row" style="margin-bottom:1.5rem;">' +
            statCard(eng.total_events || 0, "Link Visits", "#4f46e5", "&#128065;") +
            statCard(eng.qr_scans || 0, "QR Scans", "#0ea5e9", "&#9641;") +
            statCard(summary.total_cards || 0, "Cards", "#10b981", "&#127191;") +
            statCard(summary.total_products || 0, "Products", "#f59e0b", "&#128230;") +
            '</div>' +

            '<div class="row" style="margin-bottom:1.5rem;">' +
            '<div class="col-sm-8"><div class="chart-card"><h5>Visits by Day</h5><div id="chart-visits" style="height:240px;"></div></div></div>' +
            '<div class="col-sm-4"><div class="chart-card"><h5>Events by Type</h5><div id="events-type"></div></div></div>' +
            '</div>' +

            '<div class="row" style="margin-bottom:1.5rem;">' +
            '<div class="col-sm-6"><div class="chart-card"><h5>Top Cards</h5><div id="top-cards"></div></div></div>' +
            '<div class="col-sm-6"><div class="chart-card"><h5>Enquiry Pipeline</h5><div id="enquiry-pipe"></div></div></div>' +
            '</div>' +

            '<div class="row"><div class="col-sm-12"><div class="chart-card"><h5>Recent Activity</h5><div id="recent-act"></div></div></div></div>';

        container.innerHTML = html;

        renderBarChart("chart-visits", eng.events_by_day || []);
        renderEventsByType("events-type", eng.events_by_type || {});
        renderTopCards("top-cards", data.top_cards || []);
        renderEnquiryPipeline("enquiry-pipe", enq);
        renderRecentActivity("recent-act", eng.recent_events || []);
    }

    function statCard(value, label, color, icon) {
        return '<div class="col-sm-3" style="margin-bottom:1rem;"><div class="stat-card">' +
            '<div style="display:flex;justify-content:space-between;align-items:center;">' +
            '<div><div class="stat-value" style="color:' + color + ';">' + value + '</div>' +
            '<div class="stat-label">' + label + '</div></div>' +
            '<div style="font-size:1.8rem;opacity:0.3;">' + icon + '</div></div></div></div>';
    }

    function renderBarChart(id, data) {
        var el = document.getElementById(id);
        if (!data.length) { el.innerHTML = '<p style="color:#94a3b8;text-align:center;padding:3rem;">No data for this period</p>'; return; }
        var w = el.offsetWidth || 700, h = 220, pad = {t:20,r:20,b:40,l:45};
        var cw = w-pad.l-pad.r, ch = h-pad.t-pad.b;
        var max = Math.max.apply(null, data.map(function(d){return d.count;})) || 1;
        var pts = data.map(function(d,i){return {x:pad.l+(i/(data.length-1||1))*cw, y:pad.t+ch-(d.count/max)*ch, date:d.date, count:d.count};});
        var path = pts.map(function(p,i){return (i===0?"M":"L")+p.x+","+p.y;}).join(" ");
        var area = path + " L"+pts[pts.length-1].x+","+(pad.t+ch)+" L"+pts[0].x+","+(pad.t+ch)+" Z";
        var svg = '<svg width="'+w+'" height="'+h+'" style="display:block;">';
        svg += '<defs><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#4f46e5" stop-opacity="0.15"/><stop offset="100%" stop-color="#4f46e5" stop-opacity="0.01"/></linearGradient></defs>';
        for(var g=0;g<=4;g++){var gy=pad.t+(ch/4)*g;var gv=Math.round(max-(max/4)*g);svg+='<line x1="'+pad.l+'" y1="'+gy+'" x2="'+(w-pad.r)+'" y2="'+gy+'" stroke="#f1f5f9" stroke-width="1"/><text x="'+(pad.l-8)+'" y="'+(gy+4)+'" text-anchor="end" fill="#94a3b8" font-size="10">'+gv+'</text>';}
        svg += '<path d="'+area+'" fill="url(#lg)"/><path d="'+path+'" fill="none" stroke="#4f46e5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>';
        pts.forEach(function(p){svg+='<circle cx="'+p.x+'" cy="'+p.y+'" r="3.5" fill="#4f46e5" stroke="#fff" stroke-width="2"/>';});
        var le=Math.max(1,Math.floor(data.length/8));
        pts.forEach(function(p,i){if(i%le===0||i===pts.length-1)svg+='<text x="'+p.x+'" y="'+(h-10)+'" text-anchor="middle" fill="#94a3b8" font-size="9">'+p.date.slice(5)+'</text>';});
        svg += "</svg>"; el.innerHTML = svg;
    }

    function renderEventsByType(id, data) {
        var el = document.getElementById(id);
        var keys = Object.keys(data);
        if (!keys.length) { el.innerHTML = '<p style="color:#94a3b8;">No events recorded</p>'; return; }
        var total = keys.reduce(function(s,k){return s+data[k];},0);
        var colors = ["#4f46e5","#0ea5e9","#10b981","#f59e0b","#ef4444","#8b5cf6"];
        var html = '';
        keys.sort(function(a,b){return data[b]-data[a];}).forEach(function(k,i){
            var pct = total>0?((data[k]/total)*100).toFixed(1):0;
            var c = colors[i % colors.length];
            html += '<div style="margin-bottom:0.75rem;">' +
                '<div style="display:flex;justify-content:space-between;margin-bottom:0.25rem;">' +
                '<span style="font-size:0.8rem;color:#334155;">' + escapeHtml(k.replace(/_/g," ").replace(/\b\w/g,function(c){return c.toUpperCase();})) + '</span>' +
                '<span style="font-size:0.8rem;color:#64748b;">' + data[k] + ' (' + pct + '%)</span></div>' +
                '<div style="height:6px;background:#f1f5f9;border-radius:3px;overflow:hidden;">' +
                '<div style="height:100%;width:' + pct + '%;background:' + c + ';border-radius:3px;"></div></div></div>';
        });
        el.innerHTML = html;
    }

    function renderTopCards(id, data) {
        var el = document.getElementById(id);
        if (!data.length) { el.innerHTML = '<p style="color:#94a3b8;">No card views yet</p>'; return; }
        var html = '<table style="width:100%;border-collapse:collapse;font-size:0.85rem;">' +
            '<thead><tr style="border-bottom:1px solid #e2e8f0;">' +
            '<th style="text-align:left;padding:0.5rem 0;color:#64748b;font-weight:500;">Member</th>' +
            '<th style="text-align:right;padding:0.5rem 0;color:#64748b;font-weight:500;">Views</th></tr></thead><tbody>';
        data.forEach(function(d){
            html += '<tr style="border-bottom:1px solid #f1f5f9;">' +
                '<td style="padding:0.5rem 0;color:#334155;">' + escapeHtml(d.member_name||d.card||"—") + '</td>' +
                '<td style="padding:0.5rem 0;text-align:right;font-weight:600;color:#334155;">' + d.views + '</td></tr>';
        });
        html += "</tbody></table>"; el.innerHTML = html;
    }

    function renderEnquiryPipeline(id, data) {
        var el = document.getElementById(id);
        var items = [
            {l:"New",v:data.new||0,c:"#2490ef",bg:"#eff6ff"},
            {l:"Ongoing",v:data.ongoing||0,c:"#f5a623",bg:"#fffbeb"},
            {l:"Converted",v:data.converted||0,c:"#28a745",bg:"#f0fdf4"},
            {l:"Lost",v:data.lost||0,c:"#dc3545",bg:"#fef2f2"}
        ];
        var html = '<div style="display:grid;grid-template-columns:1fr 1fr;gap:0.75rem;">';
        items.forEach(function(i){
            html += '<div style="text-align:center;padding:1rem;border-radius:8px;background:' + i.bg + ';">' +
                '<div style="font-size:1.5rem;font-weight:700;color:' + i.c + ';">' + i.v + '</div>' +
                '<div style="font-size:0.75rem;color:#64748b;margin-top:0.25rem;">' + i.l + '</div></div>';
        });
        html += "</div>"; el.innerHTML = html;
    }

    function renderRecentActivity(id, data) {
        var el = document.getElementById(id);
        if (!data.length) { el.innerHTML = '<p style="color:#94a3b8;">No recent activity</p>'; return; }
        var html = '<table style="width:100%;border-collapse:collapse;font-size:0.85rem;">' +
            '<thead><tr style="border-bottom:1px solid #e2e8f0;">' +
            '<th style="text-align:left;padding:0.5rem 0;color:#64748b;font-weight:500;">Time</th>' +
            '<th style="text-align:left;padding:0.5rem 0;color:#64748b;font-weight:500;">Event</th>' +
            '<th style="text-align:left;padding:0.5rem 0;color:#64748b;font-weight:500;">Page</th>' +
            '<th style="text-align:left;padding:0.5rem 0;color:#64748b;font-weight:500;">Device</th></tr></thead><tbody>';
        data.forEach(function(d){
            var pg = d.person_name||d.card||d.product_name||d.service_name||"—";
            html += '<tr style="border-bottom:1px solid #f1f5f9;">' +
                '<td style="padding:0.5rem 0;color:#64748b;white-space:nowrap;">' + escapeHtml(d.event_time||"") + '</td>' +
                '<td style="padding:0.5rem 0;color:#334155;">' + escapeHtml((d.event_type||"").replace(/_/g," ").replace(/\b\w/g,function(c){return c.toUpperCase();})) + '</td>' +
                '<td style="padding:0.5rem 0;color:#334155;">' + escapeHtml(pg) + '</td>' +
                '<td style="padding:0.5rem 0;color:#64748b;">' + escapeHtml(d.device_type||"Unknown") + '</td></tr>';
        });
        html += "</tbody></table>"; el.innerHTML = html;
    }
});
</script>
{%- endblock -%}
