<!DOCTYPE html>
<html lang="{{ lang or 'en' }}">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title or 'OSDuo Business Connect' }}</title>
    {% if meta_description %}<meta name="description" content="{{ meta_description }}">{% endif %}
    <link rel="icon" href="/assets/frappe/images/frappe-favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/assets/osduo_business_connect/css/business_connect.css">
    <style>
        body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    </style>
</head>
<body>
    {% block page_content %}{% endblock %}
    <script>
    (function() {
        if (!document.cookie.match(/csrf_token=/)) {
            fetch('/api/method/frappe.utils.safe_exec.get_csrf_token', {method: 'POST'})
                .then(function(r) { return r.json(); })
                .then(function(r) { if (r.message) document.cookie = 'csrf_token=' + r.message + ';path=/'; })
                .catch(function() {});
        }
    })();
    </script>
</body>
</html>
