[project]
name = "osduo_business_connect"
authors = [
    { name = "OSDuo", email = "info@osduo.com" }
]
description = "Digital business identity, product/service showcase, lead generation, and CRM integration for individuals and small businesses"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["setuptools >=65.0.0"]
build-backend = "setuptools.build_meta"

[tool.bench.dev-dependencies]

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"

[tool.setuptools.dynamic]
version = {attr = "osduo_business_connect.__version__"}

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "I",
    "UP",
    "B",
    "RUF",
]
ignore = [
    "E501",
    "E741",
    "F401",
    "F403",
    "F405",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
