<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="theme-color" content="{{ theme_color }}">
	<title>{{ title }}</title>
	<style>
		:root { color-scheme: light; }
		* { box-sizing: border-box; }
		body {
			margin: 0;
			min-height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
			font-family: "Inter", -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
			background: {{ background_color }};
			color: #0f172a;
			padding: 24px;
		}
		.card {
			max-width: 380px;
			width: 100%;
			text-align: center;
			background: #fff;
			border: 1px solid #e8edf2;
			border-radius: 16px;
			padding: 32px 28px;
			box-shadow: 0 16px 50px rgba(20, 43, 70, 0.09);
		}
		.icon { font-size: 2.6rem; line-height: 1; margin-bottom: 14px; }
		h1 { margin: 0 0 8px; font-size: 1.3rem; }
		p { margin: 0 0 20px; color: #64748b; font-size: 0.92rem; line-height: 1.6; }
		button {
			appearance: none;
			border: 0;
			cursor: pointer;
			background: {{ theme_color }};
			color: #fff;
			font-weight: 600;
			font-size: 0.95rem;
			padding: 11px 22px;
			border-radius: 8px;
		}
	</style>
</head>
<body>
	<div class="card">
		<div class="icon" aria-hidden="true">&#9889;</div>
		<h1>{{ heading }}</h1>
		<p>{{ message }}</p>
		<button onclick="window.location.reload()">{{ retry_label }}</button>
	</div>
</body>
</html>
