<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Team Member — Desk Mockup</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; background: #F8FAFC; }
  .desk-header { background: #0B3D91; padding: 10px 24px; display: flex; align-items: center; justify-content: space-between; }
  .desk-header .logo { color: white; font-size: 0.85rem; font-weight: 700; }
  .breadcrumb { padding: 12px 24px; font-size: 0.75rem; color: #64748B; background: white; border-bottom: 1px solid #E2E8F0; }
  .breadcrumb a { color: #2563EB; text-decoration: none; }
  .form-container { max-width: 700px; margin: 24px auto; padding: 0 24px; }
  .form-card { background: white; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); overflow: hidden; }
  .form-header { padding: 20px 24px; border-bottom: 1px solid #F1F5F9; }
  .form-header h1 { font-size: 1.1rem; font-weight: 700; color: #0F172A; }
  .form-body { padding: 24px; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
  .form-row.full { grid-template-columns: 1fr; }
  .form-group { display: flex; flex-direction: column; gap: 4px; }
  .form-group label { font-size: 0.75rem; font-weight: 600; color: #374151; }
  .form-group label .req { color: #DC2626; }
  .form-group input, .form-group select { padding: 8px 12px; border: 1px solid #D1D5DB; border-radius: 6px; font-size: 0.8rem; color: #1E293B; background: white; }
  .form-group .hint { font-size: 0.65rem; color: #94A3B8; }
  .role-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
  .role-option { padding: 12px; border: 2px solid #E2E8F0; border-radius: 8px; text-align: center; cursor: pointer; transition: all 0.2s; }
  .role-option:hover { border-color: #2563EB; }
  .role-option.selected { border-color: #2563EB; background: #EFF6FF; }
  .role-option .role-name { font-size: 0.8rem; font-weight: 600; color: #0F172A; }
  .role-option .role-desc { font-size: 0.65rem; color: #64748B; margin-top: 2px; }
  .form-actions { padding: 16px 24px; border-top: 1px solid #F1F5F9; display: flex; gap: 8px; justify-content: flex-end; }
  .btn { padding: 8px 16px; border-radius: 6px; font-size: 0.8rem; font-weight: 600; cursor: pointer; border: none; }
  .btn-primary { background: #2563EB; color: white; }
  .btn-secondary { background: #F1F5F9; color: #475569; border: 1px solid #E2E8F0; }
  .label { text-align: center; margin: 20px auto; max-width: 600px; padding: 16px; background: #F1F5F9; border-radius: 8px; font-size: 0.75rem; color: #64748B; }
</style>
</head>
<body>
<div class="desk-header"><span class="logo">OSDuo Business Connect</span></div>
<div class="breadcrumb"><a href="#">Business</a> / <a href="#">OSDuo Tech</a> / Add Member</div>
<div class="form-container">
  <div class="form-card">
    <div class="form-header"><h1>Add Team Member</h1></div>
    <div class="form-body">
      <div class="form-row">
        <div class="form-group">
          <label>User <span class="req">*</span></label>
          <select><option>Select user...</option><option>sarah@osduo.com</option><option>john@osduo.com</option></select>
        </div>
        <div class="form-group">
          <label>Person Name <span class="req">*</span></label>
          <input type="text" value="Sarah Cornor">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Designation</label>
          <input type="text" value="Senior Software Engineer">
        </div>
        <div class="form-group">
          <label>Phone</label>
          <input type="tel" value="+91 98765 43211">
        </div>
      </div>
      <div class="form-row full">
        <div class="form-group">
          <label>Role <span class="req">*</span></label>
          <div class="role-grid">
            <div class="role-option">
              <div class="role-name">Owner</div>
              <div class="role-desc">Full control</div>
            </div>
            <div class="role-option">
              <div class="role-name">Manager</div>
              <div class="role-desc">Manage content</div>
            </div>
            <div class="role-option selected">
              <div class="role-name">Member</div>
              <div class="role-desc">Own card & content</div>
            </div>
            <div class="role-option">
              <div class="role-name">Marketing</div>
              <div class="role-desc">Products & branding</div>
            </div>
            <div class="role-option">
              <div class="role-name">CRM User</div>
              <div class="role-desc">Manage leads</div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="form-actions">
      <button class="btn btn-secondary">Cancel</button>
      <button class="btn btn-primary">Add Member</button>
    </div>
  </div>
</div>
<div class="label">Desk Mockup — Add Team Member: User, name, designation, role grid selector</div>
</body>
</html>
