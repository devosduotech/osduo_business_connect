<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enquiry Form — Public Page Mockup</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; background: #F8FAFC; min-height: 100vh; display: flex; justify-content: center; padding: 40px 20px; }
  .card { max-width: 420px; width: 100%; }
  .topbar { background: #0B3D91; border-radius: 16px 16px 0 0; padding: 8px 16px; display: flex; align-items: center; justify-content: space-between; }
  .topbar-brand span { color: white; font-size: 0.65rem; opacity: 0.8; }
  .form-card { background: white; border-radius: 0 0 16px 16px; box-shadow: 0 8px 32px rgba(0,0,0,0.08); overflow: hidden; padding: 24px; }
  .form-card h2 { font-size: 1rem; font-weight: 700; color: #0F172A; margin-bottom: 4px; }
  .form-card .subtitle { font-size: 0.8rem; color: #64748B; margin-bottom: 20px; }
  .form-group { margin-bottom: 14px; }
  .form-group label { display: block; font-size: 0.75rem; font-weight: 600; color: #374151; margin-bottom: 4px; }
  .form-group label .req { color: #DC2626; }
  .form-group input, .form-group textarea { width: 100%; padding: 10px 12px; border: 1.5px solid #E2E8F0; border-radius: 8px; font-size: 0.85rem; color: #1E293B; background: white; font-family: inherit; }
  .form-group input:focus, .form-group textarea:focus { outline: none; border-color: #2563EB; box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
  .form-group textarea { resize: vertical; min-height: 80px; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .consent { display: flex; gap: 8px; align-items: flex-start; margin-bottom: 16px; }
  .consent input { margin-top: 2px; }
  .consent label { font-size: 0.7rem; color: #64748B; }
  .submit-btn { width: 100%; padding: 12px; background: #2563EB; color: white; border: none; border-radius: 8px; font-size: 0.9rem; font-weight: 600; cursor: pointer; }
  .submit-btn:hover { background: #1D4ED8; }
  .source-badge { display: inline-block; padding: 2px 8px; background: #EFF6FF; color: #2563EB; border-radius: 4px; font-size: 0.65rem; font-weight: 600; margin-top: 12px; }
  .label { text-align: center; margin: 16px auto 0; max-width: 420px; padding: 12px; background: #F1F5F9; border-radius: 8px; font-size: 0.7rem; color: #64748B; }
</style>
</head>
<body>
<div class="card">
  <div class="topbar"><div class="topbar-brand"><span>OSDuo Business Connect</span></div></div>
  <div class="form-card">
    <h2>Get in Touch</h2>
    <p class="subtitle">Send an enquiry and we'll get back to you shortly.</p>
    <div class="form-row">
      <div class="form-group">
        <label>Full Name <span class="req">*</span></label>
        <input type="text" placeholder="John Doe">
      </div>
      <div class="form-group">
        <label>Email <span class="req">*</span></label>
        <input type="email" placeholder="john@company.com">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Phone</label>
        <input type="tel" placeholder="+91 98765 43210">
      </div>
      <div class="form-group">
        <label>Company</label>
        <input type="text" placeholder="Company Name">
      </div>
    </div>
    <div class="form-group">
      <label>Message</label>
      <textarea placeholder="Tell us about your requirements..."></textarea>
    </div>
    <div class="consent">
      <input type="checkbox" id="consent">
      <label for="consent">I consent to having my data stored and used for responding to this enquiry.</label>
    </div>
    <button class="submit-btn">Submit Enquiry</button>
    <div class="source-badge">Source: Digital Card</div>
  </div>
  <div class="label">Public Mockup — Enquiry Form: Name, email, phone, company, message, consent, source tracking</div>
</div>
</body>
</html>
