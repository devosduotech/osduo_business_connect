<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Service Benefits — Desk Mockup</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; background: #F8FAFC; }
  .desk-header { background: #0B3D91; padding: 10px 24px; display: flex; align-items: center; justify-content: space-between; }
  .desk-header .logo { color: white; font-size: 0.85rem; font-weight: 700; }
  .breadcrumb { padding: 12px 24px; font-size: 0.75rem; color: #64748B; background: white; border-bottom: 1px solid #E2E8F0; }
  .breadcrumb a { color: #2563EB; text-decoration: none; }
  .form-container { max-width: 900px; margin: 24px auto; padding: 0 24px; }
  .form-card { background: white; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); overflow: hidden; }
  .form-header { padding: 20px 24px; border-bottom: 1px solid #F1F5F9; }
  .form-header h1 { font-size: 1.1rem; font-weight: 700; color: #0F172A; }
  .form-section { padding: 12px 24px; background: #F8FAFC; border-top: 1px solid #F1F5F9; font-size: 0.8rem; font-weight: 600; color: #374151; }
  .form-body { padding: 24px; }
  .benefit-card { border: 1px solid #E2E8F0; border-radius: 8px; padding: 16px; margin-bottom: 12px; }
  .benefit-card .row { display: grid; grid-template-columns: 1fr 2fr 80px; gap: 12px; align-items: start; }
  .benefit-card label { display: block; font-size: 0.7rem; font-weight: 600; color: #374151; margin-bottom: 4px; }
  .benefit-card input, .benefit-card textarea { width: 100%; padding: 8px 12px; border: 1px solid #D1D5DB; border-radius: 6px; font-size: 0.8rem; }
  .benefit-card .delete { color: #DC2626; font-size: 0.75rem; cursor: pointer; text-align: right; padding-top: 20px; }
  .add-row { padding: 12px; text-align: center; border: 2px dashed #D1D5DB; border-radius: 8px; color: #94A3B8; font-size: 0.8rem; cursor: pointer; }
  .form-actions { padding: 16px 24px; border-top: 1px solid #F1F5F9; display: flex; gap: 8px; justify-content: flex-end; }
  .btn { padding: 8px 16px; border-radius: 6px; font-size: 0.8rem; font-weight: 600; cursor: pointer; border: none; }
  .btn-primary { background: #2563EB; color: white; }
  .btn-secondary { background: #F1F5F9; color: #475569; border: 1px solid #E2E8F0; }
  .label { text-align: center; margin: 20px auto; max-width: 600px; padding: 16px; background: #F1F5F9; border-radius: 8px; font-size: 0.75rem; color: #64748B; }
</style>
</head>
<body>
<div class="desk-header"><span class="logo">OSDuo Business Connect</span></div>
<div class="breadcrumb"><a href="#">Showcase Service</a> / <a href="#">SERV-00001</a> / Benefits</div>
<div class="form-container">
  <div class="form-card">
    <div class="form-header"><h1>Service Benefits — Web Development</h1></div>
    <div class="form-section">Benefits</div>
    <div class="form-body">
      <div class="benefit-card">
        <div class="row">
          <div><label>Title <span style="color:#DC2626">*</span></label><input type="text" value="Custom Design"></div>
          <div><label>Description</label><input type="text" value="Unique, branded designs tailored to your business identity"></div>
          <div class="delete">Remove</div>
        </div>
      </div>
      <div class="benefit-card">
        <div class="row">
          <div><label>Title <span style="color:#DC2626">*</span></label><input type="text" value="Responsive"></div>
          <div><label>Description</label><input type="text" value="Looks perfect on all devices — mobile, tablet, desktop"></div>
          <div class="delete">Remove</div>
        </div>
      </div>
      <div class="benefit-card">
        <div class="row">
          <div><label>Title <span style="color:#DC2626">*</span></label><input type="text" value="Fast Loading"></div>
          <div><label>Description</label><input type="text" value="Optimized for speed and performance"></div>
          <div class="delete">Remove</div>
        </div>
      </div>
      <div class="benefit-card">
        <div class="row">
          <div><label>Title <span style="color:#DC2626">*</span></label><input type="text" value="Secure"></div>
          <div><label>Description</label><input type="text" value="SSL, security best practices, and data protection"></div>
          <div class="delete">Remove</div>
        </div>
      </div>
      <div class="add-row">+ Add Benefit</div>
    </div>
    <div class="form-actions">
      <button class="btn btn-secondary">Cancel</button>
      <button class="btn btn-primary">Save Benefits</button>
    </div>
  </div>
</div>
<div class="label">Desk Mockup — Service Benefits: Title, Description, order, add/remove</div>
</body>
</html>
